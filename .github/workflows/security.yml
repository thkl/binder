name: Security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source formatting
        run: pnpm run format:check

      - name: Check settings translations
        run: pnpm run check:settings-i18n

      - name: Build shared contracts
        run: pnpm --filter @binder/common build

      - name: Build API
        run: pnpm --filter @binder/api build

      - name: Build worker
        run: pnpm --filter @binder/worker build

      - name: Build Angular client
        working-directory: packages/client
        run: ./node_modules/.bin/ng build

      - name: Run type checks
        run: pnpm run typecheck

      - name: Run API security tests
        run: pnpm --filter @binder/api test

      - name: Run workspace tests with coverage
        run: pnpm coverage

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
