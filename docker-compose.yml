services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
    volumes:
      - binder-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init/10-binder-database.sh:/docker-entrypoint-initdb.d/10-binder-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - binder-clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file:
      - ${BINDER_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      API_PORT: 3000
      APP_ROOT_PATH: /app
      SETUP_SECRET: ${SETUP_SECRET:?SETUP_SECRET is required}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required}
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${BINDER_HOST_PORT:-3000}:3000"
    volumes:
      - binder-document-storage:/app/storage
      - binder-logs:/app/logs

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file:
      - ${BINDER_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required}
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      APP_ROOT_PATH: /app
      MALWARE_SCAN_CONFIG_FILE: /app/clamdscan.conf
    depends_on:
      api:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - binder-document-storage:/app/storage
      - binder-logs:/app/logs
      - binder-backup-data:/app/backup

volumes:
  binder-postgres-data:
  binder-document-storage:
  binder-logs:
  binder-backup-data:
  binder-clamav-data:
