services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: binder
      POSTGRES_PASSWORD: binder
      POSTGRES_DB: binder
    ports:
      - "5432:5432"
    volumes:
      - binder-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binder -d binder"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 3000
      APP_ROOT_PATH: /app
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: binder
      DATABASE_USER: binder
      DATABASE_PASSWORD: binder
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "3000:3000"
    volumes:
      - binder-document-storage:/app/storage
      - binder-logs:/app/logs

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: binder
      DATABASE_USER: binder
      DATABASE_PASSWORD: binder
      APP_ROOT_PATH: /app
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - binder-document-storage:/app/storage
      - binder-logs:/app/logs
      - binder-backup-data:/app/backup

volumes:
  binder-postgres-data:
  binder-document-storage:
  binder-logs:
  binder-backup-data:
