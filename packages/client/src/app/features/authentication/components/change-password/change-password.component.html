<main class="centered">
  <section class="card auth-card">
    <div class="eyebrow">{{ 'password.security' | t }}</div>
    <h1>{{ title() ?? ('password.changeTitle' | t) }}</h1>
    <p class="muted">{{ message() ?? ('password.changeMessage' | t) }}</p>

    <form (submit)="submit($event)">
      <label>
        {{ 'password.old' | t }}
        <input
          type="password"
          autocomplete="current-password"
          [value]="oldPassword()"
          (input)="oldPassword.set(inputValue($event))"
          required
        />
      </label>

      <label>
        {{ 'password.new' | t }}
        <input
          type="password"
          autocomplete="new-password"
          minlength="12"
          [value]="newPassword()"
          (input)="newPassword.set(inputValue($event))"
          required
        />
      </label>

      <label>
        {{ 'password.confirm' | t }}
        <input
          type="password"
          autocomplete="new-password"
          minlength="12"
          [value]="confirmation()"
          (input)="confirmation.set(inputValue($event))"
          required
        />
      </label>

      @if (validationError(); as error) {
        <p class="error" role="alert">{{ error }}</p>
      }
      @if (auth.error(); as error) {
        <p class="error" role="alert">{{ error }}</p>
      }

      <button type="submit" [disabled]="auth.submitting()">
        {{ auth.submitting() ? ('password.saving' | t) : ('password.save' | t) }}
      </button>
    </form>
  </section>
</main>
