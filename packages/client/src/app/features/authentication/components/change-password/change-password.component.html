<main class="centered">
  <section class="card auth-card">
    <div class="eyebrow">SECURITY</div>
    <h1>{{ title }}</h1>
    <p class="muted">{{ message }}</p>

    <form (submit)="submit($event)">
      <label>
        Old password
        <input type="password" autocomplete="current-password" [value]="oldPassword()"
          (input)="oldPassword.set(inputValue($event))" required>
      </label>

      <label>
        New password
        <input type="password" autocomplete="new-password" minlength="12" [value]="newPassword()"
          (input)="newPassword.set(inputValue($event))" required>
      </label>

      <label>
        Confirm new password
        <input type="password" autocomplete="new-password" minlength="12" [value]="confirmation()"
          (input)="confirmation.set(inputValue($event))" required>
      </label>

      @if (validationError(); as error) { <p class="error" role="alert">{{ error }}</p> }
      @if (auth.error(); as error) { <p class="error" role="alert">{{ error }}</p> }

      <button type="submit" [disabled]="auth.submitting()">
        {{ auth.submitting() ? 'Saving…' : 'Save password' }}
      </button>
    </form>
  </section>
</main>
