<div class="document-actions" [class.compact]="compact()">
  <button
    type="button"
    class="document-action"
    (click)="open.emit()"
    [attr.aria-label]="'documents.open' | t"
    [title]="'documents.open' | t">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h6l2 2h5A1.5 1.5 0 0 1 20 7.5v11a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z" />
      <path d="M4 9h16" />
    </svg>
    @if (!compact()) { <span>{{ 'documents.open' | t }}</span> }
  </button>

  <a
    class="document-action"
    [href]="fileUrl()"
    [attr.download]="document().originalFilename"
    [attr.aria-label]="'documents.download' | t"
    [title]="'documents.download' | t">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3v11" />
      <path d="m7.5 10.5 4.5 4.5 4.5-4.5" />
      <path d="M5 20h14" />
    </svg>
    @if (!compact()) { <span>{{ 'documents.download' | t }}</span> }
  </a>

  <button
    type="button"
    class="document-action"
    (click)="metadata.emit()"
    [attr.aria-label]="'documents.metadata' | t"
    [title]="'documents.metadata' | t">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 5.5A1.5 1.5 0 0 1 6.5 4h11A1.5 1.5 0 0 1 19 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 18.5z" />
      <path d="M8 8h8M8 12h8M8 16h5" />
    </svg>
    @if (!compact()) { <span>{{ 'documents.metadata' | t }}</span> }
  </button>

  <button
    type="button"
    class="document-action"
    (click)="suggest.emit()"
    [disabled]="suggestionLoading()"
    [attr.aria-label]="'documents.suggest' | t"
    [title]="'documents.suggest' | t">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m12 3 1.4 5.6L19 10l-5.6 1.4L12 17l-1.4-5.6L5 10l5.6-1.4z" />
      <path d="m19 16 .6 2.4L22 19l-2.4.6L19 22l-.6-2.4L16 19l2.4-.6z" />
    </svg>
    @if (!compact()) { <span>{{ 'documents.suggest' | t }}</span> }
  </button>

  @if (canRequeue()) {
    <button
      type="button"
      class="document-action"
      (click)="requeue.emit()"
      [attr.aria-label]="'documents.requeue' | t"
      [title]="'documents.requeue' | t">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 8a8 8 0 0 0-13.7-2L4 8.3" />
        <path d="M4 4v4.3h4.3M4 16a8 8 0 0 0 13.7 2l2.3-2.3" />
        <path d="M20 20v-4.3h-4.3" />
      </svg>
      @if (!compact()) { <span>{{ 'documents.requeue' | t }}</span> }
    </button>
  }
</div>
