<div class="drawer-backdrop" role="presentation" (click)="requestClose()">
  <aside
    class="drawer-panel"
    [style.width.px]="drawerWidth()"
    [class.resizing]="resizing()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="document-drawer-title"
    (click)="$event.stopPropagation()"
  >
    <div
      class="resize-handle"
      role="separator"
      aria-orientation="vertical"
      [attr.aria-valuemin]="280"
      [attr.aria-valuemax]="960"
      [attr.aria-valuenow]="drawerWidth()"
      tabindex="0"
      (pointerdown)="startResize($event)"
      (keydown)="resizeWithKeyboard($event)"
      [attr.aria-label]="'viewer.resize' | t"
    ></div>

    <header class="drawer-header">
      <div class="drawer-heading">
        <p class="section-kicker">{{ 'viewer.kicker' | t }}</p>
        <h3 id="document-drawer-title">
          {{ documentData().title || documentData().originalFilename }}
        </h3>
      </div>
      <button
        type="button"
        class="drawer-close"
        (click)="requestClose()"
        [attr.aria-label]="'viewer.close' | t"
      >
        ×
      </button>
    </header>

    <nav class="drawer-tabs" role="tablist" [attr.aria-label]="'viewer.preview' | t">
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="activeTab() === 'preview'"
        [class.active]="activeTab() === 'preview'"
        aria-controls="document-drawer-preview"
        (click)="selectTab('preview')"
      >
        {{ 'viewer.preview' | t }}
      </button>
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="activeTab() === 'metadata'"
        [class.active]="activeTab() === 'metadata'"
        aria-controls="document-drawer-metadata"
        (click)="selectTab('metadata')"
      >
        {{ 'documents.metadata' | t }}
      </button>
    </nav>

    <main class="drawer-content">
      @if (activeTab() === 'preview') {
        <section id="document-drawer-preview" class="preview-panel" role="tabpanel">
          <iframe class="document-frame" [src]="fileUrl()" [title]="'viewer.preview' | t"></iframe>
        </section>
      } @else {
        <section id="document-drawer-metadata" class="metadata-panel" role="tabpanel">
          <binder-document-metadata-editor
            [documentUuid]="documentUuid()"
            [documentData]="documentData()"
            [suggestion]="suggestion()"
            (dirtyChange)="handleDirtyChange($event)"
            (manuallySaved)="manuallySaved.emit()"
            (closeRequest)="requestClose()"
            (suggestionTitleAccepted)="suggestionTitleAccepted.emit($event)"
            (suggestionDismissed)="suggestionDismissed.emit()"
            (suggestionAccepted)="suggestionAccepted.emit($event)"
          />
        </section>
      }
    </main>

    @if (showClosePrompt()) {
      <div class="unsaved-warning" role="alertdialog" aria-labelledby="drawer-unsaved-title">
        <strong id="drawer-unsaved-title">{{ 'documents.unsavedTitle' | t }}</strong>
        <p>{{ 'documents.unsavedCopy' | t }}</p>
        <div class="unsaved-actions">
          <button type="button" class="secondary-button" (click)="keepEditing()">
            {{ 'documents.keepEditing' | t }}
          </button>
          <button type="button" class="danger-button" (click)="discardChanges()">
            {{ 'documents.discardChanges' | t }}
          </button>
        </div>
      </div>
    }
  </aside>
</div>
