<div class="filter-menu-host">
  <button
    type="button"
    class="filter-trigger"
    [class.active]="hasActiveFilter()"
    [attr.aria-expanded]="open()"
    aria-haspopup="dialog"
    (click)="openMenu()">
    <span>{{ label() }}</span>
    @if (hasActiveFilter()) {
      <span class="filter-count">{{ draftCount() }}</span>
    }
    <span class="filter-chevron" aria-hidden="true">⌄</span>
  </button>

  @if (open()) {
    <section class="filter-popover" role="dialog" [attr.aria-label]="label()">
      <div class="filter-popover-heading">
        <strong>{{ label() }}</strong>
        <button type="button" class="close-button" [attr.aria-label]="'documents.closeFilter' | t" (click)="closeMenu()">×</button>
      </div>

      @if (options().length > 5) {
        <label class="filter-search">
          <span class="sr-only">{{ 'documents.filterSearch' | t }}</span>
          <input
            type="search"
            [value]="optionSearch()"
            [placeholder]="'documents.filterSearch' | t"
            (input)="optionSearch.set($any($event.target).value)">
        </label>
      }

      <div class="filter-actions" role="group" [attr.aria-label]="'documents.filterSelection' | t">
        <button type="button" (click)="selectAll()">{{ 'documents.selectAll' | t }}</button>
        <button type="button" (click)="selectNone()">{{ 'documents.selectNone' | t }}</button>
      </div>

      <div class="filter-options">
        @for (option of filteredOptions(); track trackOption($index, option)) {
          <label class="filter-option">
            <input
              type="checkbox"
              [checked]="isSelected(option.value)"
              (change)="toggleOption(option.value)">
            <span class="option-label">{{ option.label }}</span>
            <span class="option-count">{{ option.count }}</span>
          </label>
        } @empty {
          <p class="filter-empty">{{ 'documents.noFilterOptions' | t }}</p>
        }
      </div>

      <div class="filter-footer">
        <span>{{ draftCount() }} {{ 'documents.filterSelected' | t }}</span>
        <button type="button" class="apply-button" (click)="apply()">{{ 'documents.applyFilter' | t }}</button>
      </div>
    </section>
  }
</div>
