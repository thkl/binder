@if (auth.loading()) {
  <main class="loading"><div class="loading-mark">B</div><p>Securing your workspace…</p></main>
} @else if (!auth.user()) {
  <binder-login />
} @else if (auth.user()?.mustChangePassword) {
  <binder-change-password
    title="Choose a new password"
    message="Your temporary password must be changed before continuing." />
} @else {
  <main class="workspace">
    <header class="topbar">
      <div class="brand-lockup click" routerLink="/">
        <span class="brand-mark">B</span>
        <div>
          <div class="eyebrow">BINDER / PRIVATE CLOUD</div>
          <h1>Your document vault</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="nav-link" routerLink="/settings" routerLinkActive="active">Settings</a>
        <button class="secondary" type="button" (click)="logout()">Sign out</button>
      </div>
    </header>
    <router-outlet />
  </main>
}
