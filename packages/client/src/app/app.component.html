@if (auth.loading()) {
  <main class="loading"><p>Restoring session…</p></main>
} @else if (!auth.user()) {
  <binder-login />
} @else if (auth.user()?.mustChangePassword) {
  <binder-change-password
    title="Choose a new password"
    message="Your temporary password must be changed before continuing." />
} @else {
  <main class="workspace">
    <header class="topbar">
      <div>
        <div class="eyebrow">BINDER</div>
        <h1>Document workspace</h1>
      </div>
      <button class="secondary" type="button" (click)="logout()">Sign out</button>
    </header>
    <section class="empty-state card">
      <span class="empty-icon">↗</span>
      <h2>Your documents will live here</h2>
      <p class="muted">The secure workspace is ready for the document pipeline.</p>
    </section>
  </main>
}
