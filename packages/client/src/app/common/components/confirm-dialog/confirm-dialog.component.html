<div class="confirm-backdrop" role="presentation" (click)="closeFromBackdrop($event)">
  <section
    class="confirm-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    aria-describedby="confirm-dialog-message"
  >
    <div class="confirm-icon" aria-hidden="true">!</div>
    <div class="confirm-content">
      <h2 id="confirm-dialog-title">{{ title() }}</h2>
      <p id="confirm-dialog-message">{{ message() }}</p>
    </div>
    <footer class="confirm-actions">
      <button type="button" class="confirm-cancel" (click)="cancelled.emit()">
        {{ cancelLabel() }}
      </button>
      <button #confirmButton type="button" class="confirm-primary" (click)="confirmed.emit()">
        {{ confirmLabel() }}
      </button>
    </footer>
  </section>
</div>
